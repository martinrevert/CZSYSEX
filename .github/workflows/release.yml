name: CI/CD Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Manual version override (e.g. 1.0.0, or leave empty for auto SemVer)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Calculate Next SemVer Version
        id: semver
        shell: pwsh
        run: |
          $override = "${{ github.event.inputs.version_override }}"
          if ($override -ne "") {
              $version = $override.TrimStart('v')
              Write-Host "Manual version override provided: $version"
          } else {
              git fetch --tags --force
              $latestTag = git describe --tags --abbrev=0 2>$null
              if (-not $latestTag) {
                  $version = "1.0.0"
                  Write-Host "No previous tags found. Initializing at v$version"
              } else {
                  Write-Host "Latest tag found: $latestTag"
                  $cleanTag = $latestTag.TrimStart('v')
                  $parts = $cleanTag.Split('.')
                  $major = [int]$parts[0]
                  $minor = [int]$parts[1]
                  $patch = [int]$parts[2]

                  $commits = git log "$latestTag..HEAD" --oneline
                  if (-not $commits) {
                      Write-Host "No new commits since $latestTag. Skipping release."
                      echo "skip_release=true" >> $env:GITHUB_OUTPUT
                      exit 0
                  }

                  if ($commits -match "(?i)(BREAKING[\s\-_]CHANGE|major:)") {
                      $major++
                      $minor = 0
                      $patch = 0
                  } elseif ($commits -match "(?i)(feat:|feature:|minor:)") {
                      $minor++
                      $patch = 0
                  } else {
                      $patch++
                  }
                  $version = "$major.$minor.$patch"
              }
          }

          $tag = "v$version"
          Write-Host "Target Version: $version"
          Write-Host "Target Tag: $tag"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "skip_release=false" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC Developer Command Prompt
        if: steps.semver.outputs.skip_release != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        if: steps.semver.outputs.skip_release != 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Application & Tests
        if: steps.semver.outputs.skip_release != 'true'
        run: cmake --build build --config Release

      - name: Run Core Tests
        if: steps.semver.outputs.skip_release != 'true'
        run: .\build\Release\test_sysex.exe

      - name: Compile NSIS Installer
        if: steps.semver.outputs.skip_release != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" }
          $version = "${{ steps.semver.outputs.version }}"
          Write-Host "Building NSIS installer for version $version..."
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPP_VERSION=$version installer\cz3000_installer.nsi
          $installerPath = "dist\CZ3000SysEx_Setup_v$version.exe"
          if (-not (Test-Path $installerPath)) {
              Write-Error "Installer not found at $installerPath"
              exit 1
          }
          Write-Host "Installer created: $installerPath"

      - name: Create Git Tag
        if: steps.semver.outputs.skip_release != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.semver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Publish GitHub Release
        if: steps.semver.outputs.skip_release != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = "${{ steps.semver.outputs.version }}"
          $tag = "${{ steps.semver.outputs.tag }}"
          $installer = "dist\CZ3000SysEx_Setup_v$version.exe"

          gh release create $tag $installer `
            --title "Casio CZ-3000 SysEx $tag" `
            --generate-notes
